<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="counter-container">

    <svg
        class="counter-svg"
        viewBox="0 0 900 180"
    >

        <defs>

            <linearGradient
                id="flow-gradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"
                spreadMethod="repeat"
            >

                <stop offset="0%" stop-color="#0066ff"/>
                <stop offset="16%" stop-color="#7b2cff"/>
                <stop offset="32%" stop-color="#ff1493"/>
                <stop offset="48%" stop-color="#ff3b00"/>
                <stop offset="64%" stop-color="#ff9500"/>
                <stop offset="80%" stop-color="#ffe600"/>
                <stop offset="100%" stop-color="#0066ff"/>

                <animateTransform
                    attributeName="gradientTransform"
                    type="translate"
                    values="
                        -0.8 0;
                        0.8 0;
                        -0.8 0
                    "
                    dur="7s"
                    repeatCount="indefinite"
                />

            </linearGradient>

        </defs>


        <text
            id="counter-text"
            x="450"
            y="125"
            text-anchor="middle"
        >0 / 0</text>

    </svg>

</main>

<script src="script.js"></script>

</body>
</html>
