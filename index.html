<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="counter-container">

    <svg
        class="counter-svg"
        viewBox="0 0 900 180"
        role="img"
        aria-label="Subscriber goal counter"
    >

        <defs>

            <!-- FIRE GRADIENT -->
            <linearGradient
                id="fire-gradient"
                x1="0"
                y1="1"
                x2="0"
                y2="0"
            >

                <stop offset="0%" stop-color="#006eff"/>
                <stop offset="15%" stop-color="#00bfff"/>
                <stop offset="30%" stop-color="#ff3b00"/>
                <stop offset="48%" stop-color="#ff6500"/>
                <stop offset="65%" stop-color="#ffad00"/>
                <stop offset="82%" stop-color="#fff05c"/>
                <stop offset="100%" stop-color="#ff4500"/>

                <animate
                    attributeName="y1"
                    values="1;0.7;1"
                    dur="2.5s"
                    repeatCount="indefinite"
                />

                <animate
                    attributeName="y2"
                    values="0;-0.3;0"
                    dur="2.5s"
                    repeatCount="indefinite"
                />

            </linearGradient>


            <!-- MASK -->
            <clipPath id="counter-mask">

                <text
                    id="counter-mask-text"
                    x="450"
                    y="125"
                    text-anchor="middle"
                >0 / 0</text>

            </clipPath>

        </defs>


        <!-- ================================================= -->
        <!-- ONLY VISIBLE TEXT -->
        <!-- ================================================= -->

        <text
            id="counter-text"
            x="450"
            y="125"
            text-anchor="middle"
        >0 / 0</text>


        <!-- ================================================= -->
        <!-- FIRE EFFECT INSIDE THE TEXT -->
        <!-- ================================================= -->

        <g
            class="fire-layer"
            clip-path="url(#counter-mask)"
        >

            <rect
                x="0"
                y="0"
                width="900"
                height="180"
                fill="url(#fire-gradient)"
            />

        </g>

    </svg>

</main>

<script src="script.js"></script>

</body>
</html>
