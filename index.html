<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="counter-container">

    <svg
        class="counter-svg"
        viewBox="0 0 900 180"
        role="img"
        aria-label="Subscriber goal counter"
    >

        <defs>

            <!-- FIRE COLORS -->
            <linearGradient
                id="fire-gradient"
                x1="0"
                y1="1"
                x2="0"
                y2="0"
            >
                <stop offset="0%" stop-color="#0066ff"/>
                <stop offset="15%" stop-color="#00aaff"/>
                <stop offset="30%" stop-color="#ff3c00"/>
                <stop offset="52%" stop-color="#ff7200"/>
                <stop offset="72%" stop-color="#ffb000"/>
                <stop offset="88%" stop-color="#ffe45c"/>
                <stop offset="100%" stop-color="#ff4d00"/>

                <animate
                    attributeName="y1"
                    values="1;0.7;1"
                    dur="2.5s"
                    repeatCount="indefinite"
                />

                <animate
                    attributeName="y2"
                    values="0;-0.3;0"
                    dur="2.5s"
                    repeatCount="indefinite"
                />
            </linearGradient>


            <!-- MOVING FIRE HIGHLIGHT -->
            <linearGradient
                id="fire-flow"
                x1="0"
                y1="0"
                x2="1"
                y2="0"
            >
                <stop offset="0%" stop-color="#006eff" stop-opacity="0"/>
                <stop offset="25%" stop-color="#00aaff" stop-opacity=".8"/>
                <stop offset="45%" stop-color="#ff5500" stop-opacity=".9"/>
                <stop offset="55%" stop-color="#ffe45c" stop-opacity="1"/>
                <stop offset="75%" stop-color="#ff5500" stop-opacity=".8"/>
                <stop offset="100%" stop-color="#006eff" stop-opacity="0"/>

                <animate
                    attributeName="x1"
                    values="-1;1;-1"
                    dur="5s"
                    repeatCount="indefinite"
                />

                <animate
                    attributeName="x2"
                    values="0;2;0"
                    dur="5s"
                    repeatCount="indefinite"
                />
            </linearGradient>


            <!-- HIDDEN COUNTER SHAPE -->
            <clipPath id="counter-mask">

                <text
                    id="counter-mask-text"
                    x="450"
                    y="125"
                    text-anchor="middle"
                    fill="white"
                >0 / 0</text>

            </clipPath>

        </defs>


        <!-- ===================================================== -->
        <!-- ONLY VISIBLE COUNTER TEXT -->
        <!-- ===================================================== -->

        <text
            id="counter-text"
            x="450"
            y="125"
            text-anchor="middle"
        >0 / 0</text>


        <!-- ===================================================== -->
        <!-- FIRE EFFECT -->
        <!-- ===================================================== -->

        <g
            class="fire-effect"
            clip-path="url(#counter-mask)"
        >

            <rect
                x="0"
                y="0"
                width="900"
                height="180"
                fill="url(#fire-gradient)"
            />

            <rect
                x="0"
                y="0"
                width="900"
                height="180"
                fill="url(#fire-flow)"
                opacity=".5"
            />

            <!-- ORANGE FLAME -->
            <path
                class="flame flame-orange"
                d="
                    M0 150
                    C70 115 120 150 180 115
                    C240 80 290 150 350 110
                    C410 70 460 150 520 105
                    C580 65 630 145 700 100
                    C770 55 830 130 900 90
                    L900 180
                    L0 180
                    Z
                "
            />

            <!-- BLUE FLAME -->
            <path
                class="flame flame-blue"
                d="
                    M0 160
                    C80 125 140 165 220 125
                    C300 85 350 165 430 120
                    C510 75 570 160 650 115
                    C730 70 810 145 900 105
                    L900 180
                    L0 180
                    Z
                "
            />

        </g>

    </svg>

</main>

<script src="script.js"></script>

</body>
</html>
