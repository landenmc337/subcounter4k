<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="counter-container">

    <svg
        class="counter-svg"
        viewBox="0 0 900 180"
        role="img"
        aria-label="Subscriber goal counter"
    >

        <defs>

            <!-- FIRE GRADIENT -->
            <linearGradient
                id="fire-gradient"
                x1="0"
                y1="1"
                x2="0"
                y2="0"
            >

                <stop offset="0%" stop-color="#0066ff"/>
                <stop offset="12%" stop-color="#00aaff"/>
                <stop offset="25%" stop-color="#ff3c00"/>
                <stop offset="50%" stop-color="#ff7800"/>
                <stop offset="72%" stop-color="#ffb000"/>
                <stop offset="88%" stop-color="#ffe45c"/>
                <stop offset="100%" stop-color="#ff5a00"/>

                <animate
                    attributeName="y1"
                    values="1;0.72;1"
                    dur="2.4s"
                    repeatCount="indefinite"
                />

                <animate
                    attributeName="y2"
                    values="0;-0.28;0"
                    dur="2.4s"
                    repeatCount="indefinite"
                />

            </linearGradient>


            <!-- MOVING ORANGE / BLUE HIGHLIGHT -->
            <linearGradient
                id="flow-gradient"
                x1="-1"
                y1="0"
                x2="1"
                y2="0"
            >

                <stop
                    offset="0%"
                    stop-color="#006eff"
                    stop-opacity="0"
                />

                <stop
                    offset="25%"
                    stop-color="#008cff"
                    stop-opacity=".8"
                />

                <stop
                    offset="45%"
                    stop-color="#ff6500"
                    stop-opacity=".9"
                />

                <stop
                    offset="55%"
                    stop-color="#ffd34d"
                    stop-opacity="1"
                />

                <stop
                    offset="75%"
                    stop-color="#ff5500"
                    stop-opacity=".8"
                />

                <stop
                    offset="100%"
                    stop-color="#006eff"
                    stop-opacity="0"
                />

                <animate
                    attributeName="x1"
                    values="-1;1;-1"
                    dur="5s"
                    repeatCount="indefinite"
                />

                <animate
                    attributeName="x2"
                    values="1;3;1"
                    dur="5s"
                    repeatCount="indefinite"
                />

            </linearGradient>


            <!-- TEXT MASK -->
            <clipPath id="counter-mask">

                <text
                    id="counter-mask-text"
                    x="450"
                    y="125"
                    text-anchor="middle"
                >0 / 0</text>

            </clipPath>

        </defs>


        <!-- MAIN COUNTER -->
        <text
            id="counter-text"
            x="450"
            y="125"
            text-anchor="middle"
        >0 / 0</text>


        <!-- MOVING FIRE INSIDE NUMBERS -->
        <g
            clip-path="url(#counter-mask)"
        >

            <!-- Moving color -->
            <rect
                x="0"
                y="0"
                width="900"
                height="180"
                fill="url(#flow-gradient)"
                opacity=".55"
            />


            <!-- Orange flame -->
            <path
                class="flame flame-one"
                d="
                M0 145
                C70 115 110 145 160 115
                C220 80 260 150 320 110
                C380 70 430 150 490 105
                C550 65 600 145 665 100
                C730 55 790 140 900 85
                L900 190
                L0 190
                Z"
            />


            <!-- Blue flame -->
            <path
                class="flame flame-two"
                d="
                M0 160
                C90 125 140 165 220 125
                C300 85 350 165 430 120
                C510 75 570 160 650 115
                C730 70 800 150 900 105
                L900 190
                L0 190
                Z"
            />

        </g>

    </svg>

</main>

<script src="script.js"></script>

</body>
</html>
