<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="counter-container">

        <svg
            class="counter-svg"
            viewBox="0 0 900 180"
            role="img"
            aria-label="Subscriber goal counter"
        >

            <defs>

                <!-- ================================================= -->
                <!-- FIRE GRADIENT -->
                <!-- ================================================= -->

                <linearGradient
                    id="fire-gradient"
                    x1="0"
                    y1="180"
                    x2="0"
                    y2="-180"
                    gradientUnits="userSpaceOnUse"
                >

                    <stop
                        offset="0%"
                        stop-color="#007BFF"
                    />

                    <stop
                        offset="12%"
                        stop-color="#00BFFF"
                    />

                    <stop
                        offset="25%"
                        stop-color="#FF4D00"
                    />

                    <stop
                        offset="45%"
                        stop-color="#FF7A00"
                    />

                    <stop
                        offset="62%"
                        stop-color="#FFD000"
                    />

                    <stop
                        offset="78%"
                        stop-color="#FFF36A"
                    />

                    <stop
                        offset="100%"
                        stop-color="#FF3B00"
                    />

                    <animate
                        attributeName="y1"
                        values="180;-180;180"
                        dur="4s"
                        repeatCount="indefinite"
                    />

                    <animate
                        attributeName="y2"
                        values="-180;180;-180"
                        dur="4s"
                        repeatCount="indefinite"
                    />

                </linearGradient>


                <!-- ================================================= -->
                <!-- MOVING FIRE HIGHLIGHT -->
                <!-- ================================================= -->

                <linearGradient
                    id="fire-highlight"
                    x1="-900"
                    y1="0"
                    x2="0"
                    y2="0"
                    gradientUnits="userSpaceOnUse"
                >

                    <stop
                        offset="0%"
                        stop-color="#FF3B00"
                        stop-opacity="0"
                    />

                    <stop
                        offset="25%"
                        stop-color="#FF7A00"
                        stop-opacity=".8"
                    />

                    <stop
                        offset="50%"
                        stop-color="#FFF36A"
                        stop-opacity="1"
                    />

                    <stop
                        offset="75%"
                        stop-color="#FF7A00"
                        stop-opacity=".8"
                    />

                    <stop
                        offset="100%"
                        stop-color="#FF3B00"
                        stop-opacity="0"
                    />

                    <animate
                        attributeName="x1"
                        values="-900;900;-900"
                        dur="5s"
                        repeatCount="indefinite"
                    />

                    <animate
                        attributeName="x2"
                        values="0;1800;0"
                        dur="5s"
                        repeatCount="indefinite"
                    />

                </linearGradient>


                <!-- ================================================= -->
                <!-- FIRE DISTORTION -->
                <!-- ================================================= -->

                <filter
                    id="fire-distortion"
                    x="-20%"
                    y="-30%"
                    width="140%"
                    height="160%"
                >

                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.018 0.055"
                        numOctaves="2"
                        seed="7"
                        result="noise"
                    >

                        <animate
                            attributeName="baseFrequency"
                            values="
                                0.018 0.055;
                                0.024 0.075;
                                0.018 0.055
                            "
                            dur="3s"
                            repeatCount="indefinite"
                        />

                    </feTurbulence>

                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="noise"
                        scale="12"
                        xChannelSelector="R"
                        yChannelSelector="G"
                    />

                </filter>


                <!-- ================================================= -->
                <!-- SOFT FIRE GLOW -->
                <!-- ================================================= -->

                <filter
                    id="fire-glow"
                    x="-30%"
                    y="-40%"
                    width="160%"
                    height="180%"
                >

                    <feGaussianBlur
                        stdDeviation="5"
                        result="blur"
                    />

                    <feMerge>

                        <feMergeNode
                            in="blur"
                        />

                        <feMergeNode
                            in="SourceGraphic"
                        />

                    </feMerge>

                </filter>


                <!-- ================================================= -->
                <!-- TEXT MASK -->
                <!-- ================================================= -->

                <clipPath id="counter-text-mask">

                    <text
                        id="counter-mask-text"
                        x="450"
                        y="125"
                        text-anchor="middle"
                    >0 / 0</text>

                </clipPath>

            </defs>


            <!-- ===================================================== -->
            <!-- OUTER FIRE GLOW -->
            <!-- ===================================================== -->

            <text
                id="counter-glow"
                x="450"
                y="125"
                text-anchor="middle"
            >0 / 0</text>


            <!-- ===================================================== -->
            <!-- MAIN FIRE TEXT -->
            <!-- ===================================================== -->

            <text
                id="counter-text"
                x="450"
                y="125"
                text-anchor="middle"
            >0 / 0</text>


            <!-- ===================================================== -->
            <!-- MOVING FIRE INSIDE TEXT -->
            <!-- ===================================================== -->

            <g
                id="fire-layer"
                clip-path="url(#counter-text-mask)"
            >

                <rect
                    x="-100"
                    y="-100"
                    width="1100"
                    height="400"
                    fill="url(#fire-gradient)"
                    filter="url(#fire-distortion)"
                />

                <rect
                    x="-900"
                    y="-100"
                    width="1800"
                    height="400"
                    fill="url(#fire-highlight)"
                    opacity=".65"
                />


                <!-- FIRE WAVES -->

                <path
                    class="flame-wave flame-wave-1"
                    d="
                        M0 150
                        C80 110 120 175 200 130
                        C280 85 320 165 400 120
                        C480 75 530 160 610 115
                        C700 65 760 150 900 95
                        L900 250
                        L0 250
                        Z
                    "
                />

                <path
                    class="flame-wave flame-wave-2"
                    d="
                        M0 175
                        C100 130 150 190 240 145
                        C330 100 390 185 470 135
                        C550 90 620 180 700 125
                        C790 75 840 150 900 115
                        L900 250
                        L0 250
                        Z
                    "
                />

            </g>


        </svg>

    </main>


    <script src="script.js"></script>

</body>
</html>
