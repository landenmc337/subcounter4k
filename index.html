<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriber Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="counter-container">

        <svg
            class="counter-svg"
            viewBox="0 0 900 180"
            role="img"
            aria-label="Subscriber goal counter"
        >

            <defs>

                <!-- ================================================= -->
                <!-- DEEP FIRE GRADIENT -->
                <!-- ================================================= -->

                <linearGradient
                    id="fire-gradient"
                    x1="0"
                    y1="1"
                    x2="0"
                    y2="0"
                    gradientUnits="objectBoundingBox"
                >

                    <stop
                        offset="0%"
                        stop-color="#004cff"
                    />

                    <stop
                        offset="10%"
                        stop-color="#00a8ff"
                    />

                    <stop
                        offset="22%"
                        stop-color="#006cff"
                    />

                    <stop
                        offset="30%"
                        stop-color="#ff3000"
                    />

                    <stop
                        offset="43%"
                        stop-color="#ff4d00"
                    />

                    <stop
                        offset="57%"
                        stop-color="#ff8500"
                    />

                    <stop
                        offset="70%"
                        stop-color="#ffc400"
                    />

                    <stop
                        offset="82%"
                        stop-color="#fff06a"
                    />

                    <stop
                        offset="92%"
                        stop-color="#ff7200"
                    />

                    <stop
                        offset="100%"
                        stop-color="#ff2500"
                    />

                    <!-- Continuous movement -->

                    <animateTransform
                        attributeName="gradientTransform"
                        type="translate"
                        values="
                            0 0;
                            0 .12;
                            0 0;
                            0 -.12;
                            0 0
                        "
                        dur="2.8s"
                        repeatCount="indefinite"
                    />

                </linearGradient>


                <!-- ================================================= -->
                <!-- FIRE GLOW -->
                <!-- ================================================= -->

                <filter
                    id="fire-glow"
                    x="-30%"
                    y="-40%"
                    width="160%"
                    height="180%"
                >

                    <feGaussianBlur
                        stdDeviation="4"
                        result="blur"
                    />

                    <feMerge>

                        <feMergeNode
                            in="blur"
                        />

                        <feMergeNode
                            in="SourceGraphic"
                        />

                    </feMerge>

                </filter>

            </defs>


            <!-- ================================================= -->
            <!-- ONE SINGLE COUNTER -->
            <!-- ================================================= -->

            <text
                id="counter-text"
                x="450"
                y="125"
                text-anchor="middle"
            >0 / 0</text>

        </svg>

    </main>

    <script src="script.js"></script>

</body>
</html>
